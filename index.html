    {id:'N3',stage:0,title:'标签三：比较两处环位',prompt:'观察座位图，再按环上连续座位 1—6 核对位置。',molecule:'苯环上两处 —CH₃；看下方座位图',diagram:[0,1],points:5,steps:[choice('count','第二个甲基相对第一个位于',[['a','相邻位'],['b','隔一个环碳'],['c','相对位']],'a'),choice('locant','从一个甲基作为 1 位，最低位次组合是',[['a','1,4'],['b','1,3'],['c','1,2']],'c'),nameStep(['1,2-二甲苯','邻二甲苯','邻-二甲苯','邻位二甲苯'])],hints:['沿环只走一条边就遇到第二个甲基。','相邻为 1,2，也叫邻位；环可整体旋转。'],output:'相邻的两个甲基为 1,2-二甲苯（邻二甲苯）。',practice:{prompt:'苯环甲基在 1 位和 6 位；换方向编号后是哪一种？',options:[['a','间二甲苯'],['b','邻二甲苯'],['c','对二甲苯']],answer:'b',explain:'1 与 6 相邻，反向编号得到 1,2，仍是邻二甲苯。'}},
    {id:'N4',stage:0,title:'标签四：再看两处环位',prompt:'观察座位图，核对两个甲基之间的环位关系。',molecule:'苯环上两处 —CH₃；看下方座位图',diagram:[0,3],points:5,steps:[choice('relative','沿环从 1 位到另一甲基，最短需走',[['a','一条环边'],['b','两条环边'],['c','三条环边']],'c'),choice('locant','相应的最小位次是',[['a','1,4'],['b','1,2'],['c','1,3']],'a'),nameStep(['1,4-二甲苯','对二甲苯','对-二甲苯','对位二甲苯'])],hints:['六元环上的相对两个座位间隔三条边。','1,4 对应对位；不要只写二甲苯而漏掉位置。'],output:'相对位的两个甲基是 1,4-二甲苯（对二甲苯）。',practice:{prompt:'两甲基分别位于苯环 1 位和 3 位，名称应是？',options:[['a','邻二甲苯'],['b','对二甲苯'],['c','间二甲苯']],answer:'c',explain:'1,3 是间位，名称为间二甲苯。'}},
    {id:'S1',stage:1,title:'工单一：给甲苯搭简式',prompt:'先确认连接方式，再独立写出结构简式。',molecule:'目标名称：甲苯',points:5,steps:[choice('structure','选出对应的连接方式',[['a','苯环—CH₂CH₃'],['b','苯环—CH₃'],['c','苯环—CH=CH₂']],'b',{cards:true,confirm:true}),choice('formula','它的分子式',[['a','C₇H₈'],['b','C₈H₁₀'],['c','C₆H₆']],'a'),{key:'short',title:'写出可见连接关系的结构简式',type:'text',answers:['C6H5CH3','CH3C6H5','C6H5(CH3)'],note:'普通数字或下标均可；只写分子式不够。'}],hints:['苯环上接一枚甲基，先确认只有一处连接。','苯环取代后为 C₆H₅，接上 CH₃；分子式 C₇H₈ 不表明连接。'],output:'甲苯结构简式 C₆H₅CH₃（或 CH₃C₆H₅），分子式 C₇H₈。',practice:{prompt:'另一张工单是乙苯，哪项结构简式表达了一条乙基侧链？',options:[['a','C₆H₅CH₂CH₃'],['b','C₆H₄(CH₃)₂'],['c','C₆H₅CH₃']],answer:'a',explain:'C₆H₅CH₂CH₃ 的乙基是一条连续二碳侧链。'}},
    {id:'S2',stage:1,title:'工单二：给乙苯搭简式',prompt:'不要把一条乙基误拆成两个甲基。',molecule:'目标名称：乙苯',points:6,steps:[choice('structure','选出环与侧链的连接图',[['a','苯环 1、2 位各接 —CH₃'],['b','苯环单接 —CH₃'],['c','苯环单接 —CH₂CH₃']],'c',{cards:true,confirm:true}),choice('formula','逐个数碳氢所得分子式',[['a','C₈H₈'],['b','C₈H₁₀'],['c','C₇H₈']],'b'),{key:'short',title:'写出乙苯的结构简式',type:'text',answers:['C6H5CH2CH3','CH3CH2C6H5','C6H5C2H5','C2H5C6H5','C6H5(CH2CH3)'],note:'可写正向或反向；须表达乙基接在苯环的一处。'}],hints:['看环上接了几处侧链。','乙苯为 C₆H₅ 与 C₂H₅ 相连；C₈H₁₀ 也是二甲苯的分子式。'],output:'乙苯可写 C₆H₅CH₂CH₃ 或 C₂H₅C₆H₅，分子式 C₈H₁₀。',practice:{prompt:'苯环上只有一处 —CH₂CH₃，另一张卡却在两处各放 —CH₃。两者关系是什么？',options:[['a','同一结构的反向书写'],['b','分子式相同，连接方式不同'],['c','分子式必不相同']],answer:'b',explain:'两者均为 C₈H₁₀，但乙基与两个甲基的连接方式不同。'}},
    {id:'S3',stage:1,title:'工单三：把两个甲基放在间位',prompt:'根据目标名称完成环位、分子式和结构简式，三步结果应彼此一致。',molecule:'目标名称：间二甲苯',points:7,steps:[ringStep('position','在苯环上放置两枚 —CH₃；相邻座位顺序为 1—6',2),choice('formula','逐个数出的分子式',[['a','C₈H₈'],['b','C₇H₈'],['c','C₈H₁₀']],'c'),{key:'short',title:'写出该物质的结构简式',type:'text',answers:xyleneShortAnswers(['1,3','3,1','m','间','间位']),note:'答案应能唯一对应上方已经确认的环位；可用普通数字输入。'}],hints:['第一个甲基定为 1 位，另一个与它隔一个环碳。','结构简式应同时写出两个甲基和 1,3（或 m-/间-）的位置。'],output:'间二甲苯可写 1,3-C₆H₄(CH₃)₂ 或 1,3-(CH₃)₂C₆H₄；裸式未指明异构体。',practice:{prompt:'若两个甲基位于环上相邻座位，哪项简式明确表意？',options:[['a','C₆H₄(CH₃)₂'],['b','1,2-C₆H₄(CH₃)₂'],['c','1,4-C₆H₄(CH₃)₂']],answer:'b',explain:'1,2- 明确标出邻位；裸式未指定邻、间、对。'}},
    {id:'S4',stage:1,title:'工单四：拼出对二甲苯',prompt:'根据目标名称完成环位、分子式和结构简式，三步结果应彼此一致。',molecule:'目标名称：对二甲苯',points:7,steps:[ringStep('position','在苯环上放置两枚 —CH₃；相邻座位顺序为 1—6',3),choice('formula','逐个数出的分子式',[['a','C₈H₁₀'],['b','C₇H₈'],['c','C₈H₈']],'a'),{key:'short',title:'写出该物质的结构简式',type:'text',answers:xyleneShortAnswers(['1,4','4,1','p','对','对位']),note:'答案应能唯一对应上方已经确认的环位；可用普通数字输入。'}],hints:['六元环上 1 与 4 相对，可整体旋转，不改变对位关系。','把位置前缀 1,4-、p- 或 对- 与两个甲基的连接简式一起写出。'],output:'1,4-C₆H₄(CH₃)₂ 与 p-(CH₃)₂C₆H₄ 都是对二甲苯；C₆H₄(CH₃)₂ 单独不能区别邻、间、对。',practice:{prompt:'另一位同学写“C₆H₄(CH₃)₂”，未画环位。教师应怎样判断？',options:[['a','一定是对二甲苯'],['b','一定是邻二甲苯'],['c','能看出二甲苯骨架，但邻间对位置未说明']],answer:'c',explain:'单写 C₆H₄(CH₃)₂ 有三种位置异构可能；必须补上位置。'}},
    {id:'I1',stage:2,title:'C₈H₁₀：先筛同分子式',prompt:'限定一个苯环、只含碳氢，并且环外是饱和侧链；选出全部符合的卡，再去重。',molecule:'范围：C₈H₁₀ · 单苯环芳香烃 · 饱和侧链',points:10,steps:[choice('select','选出全部符合范围的结构卡',[['a','C₆H₅—CH₂CH₃'],['b','1,2-C₆H₄(CH₃)₂'],['c','1,3-C₆H₄(CH₃)₂'],['d','1,4-C₆H₄(CH₃)₂'],['e','C₆H₅—CH₃'],['f','C₆H₅—CH=CH₂'],['g','苯 C₆H₆']],['a','b','c','d'],{type:'multi',confirm:true,cards:true}),choice('count','这些卡中不重复的结构共有',[['a','3 种'],['b','4 种'],['c','5 种']],'b')],hints:['先按碳氢总数筛出 C₈H₁₀，再核对侧链。','乙苯一类，二甲苯有邻、间、对三类。'],output:'范围内四种：乙苯、邻二甲苯、间二甲苯、对二甲苯。',practice:{prompt:'仍限定单苯环 C₈H₁₀ 和饱和侧链。乙苯、邻二甲苯、间二甲苯、对二甲苯及重复画的邻二甲苯去重后几种？',options:[['a','5 种'],['b','3 种'],['c','4 种']],answer:'c',explain:'重复画法不另算，仍为乙苯和三个二甲苯，共四种。'}},
    {id:'I2',stage:2,title:'转环、反向编号与异构关系',prompt:'先判定重复卡，再解释四类结构的区别。',molecule:'座位图卡（未统一重新编号）：A 乙苯；B 甲基在 1、2 位；C 在 1、6 位；D 在 1、3 位；E 在 2、4 位；F 在 1、4 位',points:15,steps:[choice('duplicate','选出全部重复的卡片对',[['bc','B 与 C：1,2 和 1,6'],['de','D 与 E：1,3 和 2,4'],['bf','B 与 F：邻和对']],['bc','de'],{type:'multi',confirm:true,cards:true}),choice('count','去重后共有几类 C₈H₁₀ 单苯环饱和侧链结构',[['a','4 类'],['b','5 类'],['c','6 类']],'a'),choice('relation','哪项比较准确',[['a','乙苯和二甲苯只是环上位次不同'],['b','三个二甲苯互为位置异构；乙苯与它们连接方式不同'],['c','1,2 和 1,4 是同一结构']],'b')],hints:['绕环重新编号不会改变两个甲基之间隔了几条环边。','1,6 相邻；2,4 间隔一个环碳。比较乙基与两个甲基的连接。'],output:'B/C 同为邻位，D/E 同为间位；加乙苯、对二甲苯共四类，三个二甲苯互为位置异构。',practice:{prompt:'另一组图：甲基位于 3、6 位。绕环重编号后与哪一类相同？',options:[['a','邻二甲苯'],['b','间二甲苯'],['c','对二甲苯']],answer:'c',explain:'3 与 6 在六元环上相对，重编号等同 1,4-二甲苯。'}},
    {id:'E1',stage:3,title:'任务一：环与侧链的颜色线索',prompt:'两组样品已预设。先后不限，分别运行虚拟记录，再用两组观察解释差异。',learningGoal:'比较两种已知芳香烃在同一冷条件下的模型观察，并联系侧链结构。',principle:'紫色来自模型试剂；某些可反应的不饱和侧链会使可见颜色改变。判断时要比较样品结构和两组记录，不能只凭名字或颜色给出纯度结论。',molecule:'冷、稀 KMnO₄ 虚拟模型｜A：苯 C₆H₆ ｜ B：苯乙烯 C₆H₅CH=CH₂',points:10,lab:true,preset:{A:'benzene',B:'styrene'},samples:[['benzene','苯 C₆H₆'],['styrene','苯乙烯 C₆H₅CH=CH₂']],observations:{benzene:'紫色基本保持',styrene:'紫色明显变浅'},conclusionLabel:'第1步｜概括这次观察',conclusions:[['a','两组紫色都基本保持'],['b','A 保持紫色，B 明显变浅；观察不同'],['c','A 明显变浅，B 保持紫色']],answerConclusion:'b',evidenceLabel:'第2步｜选择结构依据',evidence:[['a','只要有苯环就必然使紫色迅速变浅'],['b','颜色不同只因为 A、B 名称不同'],['c','B 有苯环外的 C=C 侧链；本模型中该结构与颜色变化相符']],answerEvidence:'c',hints:['先看两组记录，不急着猜名称。','比较苯环外是否还有 C=C；不能把苯环当普通烯烃双键。'],output:'本模型中苯保持紫色，苯乙烯的乙烯基侧链对应褪色；这是结构线索，不是纯度证明。',practice:{prompt:'虚拟冷条件下，已知乙苯组紫色保持，苯乙烯组变浅。最合适的解释是？',options:[['a','苯乙烯的侧链含 C=C，可提供本模型中的反应线索'],['b','所有苯环都会同样迅速褪色'],['c','乙苯与苯乙烯必有相同侧链']],answer:'a',explain:'两者都有苯环，苯乙烯另有乙烯基侧链；只在本模型条件下解释观察。'}},
    {id:'E2',stage:3,title:'任务二：换条件再比较',prompt:'两组样品和较强的虚拟氧化模型已预设。两组都运行后再判断。',learningGoal:'比较有无烷基侧链的已知芳香烃，并说明条件改变后的证据边界。',principle:'某些带苄位氢的烷基侧链在特定较强氧化模型中可发生变化；苯环本身不等同普通烯烃。颜色证据要连同模型条件一起描述，不应跨条件直接套用。',molecule:'较强 KMnO₄ 虚拟氧化模型｜A：苯 C₆H₆ ｜ B：甲苯 C₆H₅CH₃',points:10,lab:true,preset:{A:'benzene',B:'toluene'},samples:[['benzene','苯 C₆H₆'],['toluene','甲苯 C₆H₅CH₃']],observations:{benzene:'紫色基本保持',toluene:'紫色明显变浅，侧链发生模型氧化'},conclusionLabel:'第1步｜在本题条件下怎样概括',conclusions:[['a','A 变浅，B 保持'],['b','A、B 完全相同'],['c','A 保持，B 变浅，说明本次比较存在差异']],answerConclusion:'c',evidenceLabel:'第2步｜联系条件和结构',evidence:[['a','B 有可在本模型条件下反应的甲基侧链；不能把这一观察套用到所有冷条件'],['b','B 没有苯环'],['c','只要分子式不同就一定出现这项颜色差异']],answerEvidence:'a',hints:['本题条件与上一题不同，先看本次两份记录。','比较有无甲基侧链；不要把较强模型结果外推到冷条件。'],output:'在给定较强氧化模型中，甲苯侧链对应颜色变化，苯组保持；条件不同不能混用观察。',practice:{prompt:'另一组较强氧化模型：已知苯保持紫色，乙苯因侧链变化而变浅。哪项报告准确？',options:[['a','可证明所有未知无色样品都是乙苯'],['b','仅在给定模型条件下，这项差异支持侧链参与反应'],['c','苯环被证明会在所有冷条件下迅速褪色']],answer:'b',explain:'把观察、模型条件和结构线索连起来，结论只限于给定比较。'}},
    {id:'E3',stage:3,title:'任务三：未知 X 的结论边界',prompt:'A 是已知参照，B 是未知 X。运行两组，判断证据最多支持什么。',learningGoal:'据已知参照和未知样品的同条件观察，写出不过度认定身份和纯度的结论。',principle:'相同现象可能来自不同的可反应结构；要鉴定未知样品，还需排除其他可能。一次模型观察可作为线索，不能单独证明分子身份或样品纯度。',molecule:'冷、稀 KMnO₄ 虚拟模型｜A：已知苯乙烯 ｜ B：未知 X',points:10,lab:true,preset:{A:'known',B:'unknown'},samples:[['known','已知苯乙烯'],['unknown','未知 X']],observations:{known:'紫色明显变浅',unknown:'紫色明显变浅'},conclusionLabel:'第1步｜提交有边界的结论',conclusions:[['a','X 肯定是纯苯乙烯'],['b','X 可能含使试剂变色的成分，不能仅凭本次现象证明是纯苯乙烯'],['c','X 肯定是苯']],answerConclusion:'b',evidenceLabel:'第2步｜指出证据限制',evidence:[['a','同一观察可以直接复制已知参照的身份'],['b','一次褪色能检出 X 的全部成分'],['c','X 与参照现象相同，但其他可反应结构也可能产生相同现象']],answerEvidence:'c',hints:['先把观察说清，再区分“可能”与“肯定”。','未知样品与参照同色变，不代表结构和纯度完全相同。'],output:'未知 X 的模型褪色只提示可能含可反应成分；不能据此唯一指认苯乙烯或判定纯度。',practice:{prompt:'未知 Y 在同一冷模型中使紫色变浅。哪份简报符合证据强度？',options:[['a','Y 必为纯苯乙烯'],['b','Y 肯定没有其他成分'],['c','Y 可能含可反应结构；需其他证据确认具体身份与纯度']],answer:'c',explain:'一次颜色变化仅是线索，其他物质或混合物也可能有同类观察。'}}

  function renderReport(){if(!reportReady()){screen='task';return render()}startClock(-1);var rows=summaryRows();$('content').innerHTML='<div class="eyebrow">通关 · 课堂学习成绩</div><div class="layout-head"><div><h1>四关都已完成</h1><p class="lead">为一份可靠结论点赞，也为每次认真修正点赞。</p></div><div class="score-big">'+calculateScore()+'<small style="font-size:18px"> / 100</small></div></div><div class="report-grid"><div>班级与姓名<br><strong id="reportPerson"></strong></div><div>学号<br><strong id="reportNumber"></strong></div><div>开始时间 / 结束时间<br><strong>'+dateTime(state.started)+'<br>'+dateTime(state.ended)+'</strong></div><div>页面可见活动总用时<br><strong>'+activity()+' 秒</strong></div></div><p class="tip">训练编号：'+escapeHtml(state.sessionId)+' · <strong style="color:var(--red)">错题变式已全部完成</strong>。活动时间只累计本页面可见且尚未结案的时段；若浏览器异常退出，最近一次检查点后的少量时间可能丢失。</p><div class="table-wrap"><table><thead><tr><th>关卡</th><th>正式分</th><th>正式尝试</th><th>已巩固错题</th><th>完成时间</th></tr></thead><tbody>'+rows.map(function(x,n){return '<tr><td>'+escapeHtml(x.name)+'</td><td>'+x.score+'</td><td>'+x.attempts+'</td><td>'+x.practice+'</td><td>'+escapeHtml(dateTime(stageDoneAt(n)))+'</td></tr>'}).join('')+'</tbody></table></div><label style="display:block;margin:16px 0">自评最难部分（可选） <select id="selfAssess"><option value="">暂不填写</option>'+STAGES.map(function(x){return '<option value="'+escapeHtml(x.name)+'">'+escapeHtml(x.name)+'</option>'}).join('')+'</select></label>'+quickFormBoxHtml(3)+shareBoxHtml()+'<div class="actions"><button class="primary" id="printBtn">打印一页成绩单</button><button id="reviewReport">只读复盘</button></div><p class="report-note">QuickForm 最终记录包含身份、四关成绩与详细轨迹；短码和 CSV 仅作离线备份。配套教师解析页按提交键与训练编号合并重复记录。校验只能发现普通复制损坏，不能证明记录未被故意修改。</p><textarea id="copyFallback" class="hidden-fallback" hidden aria-label="复制回退文本"></textarea>'+footer();$('reportPerson').textContent=state.identity.className+' · '+state.identity.name;$('reportNumber').textContent=state.identity.number;$('selfAssess').value=state.selfAssess;$('selfAssess').onchange=function(){stat   function renderPrint(){var card=$('printCard');if(!reportReady()){card.innerHTML='';return}var rows=summaryRows();card.innerHTML='<h1>芳香烃四类通关 · 课堂成绩单</h1><p>V3.6 · 四关结构与证据学习 · 一页记录</p><div class="print-grid"><p>班级：<strong>'+escapeHtml(state.identity.className)+'</strong></p><p>姓名：<strong>'+escapeHtml(state.identity.name)+'</strong></p><p>学号：<strong>'+escapeHtml(state.identity.number)+'</strong></p><p>训练编号：<strong>'+escapeHtml(state.sessionId)+'</strong></p><p>开始：'+escapeHtml(dateTime(state.started))+'</p><p>结束：'+escapeHtml(dateTime(state.ended))+'</p><p>活动用时：'+activity()+' 秒</p><p>自评最难：'+escapeHtml(state.selfAssess||'未填写')+'</p></div><div class="print-box"><div class="print-score">'+calculateScore()+' <span style="font-size:12pt;color:#183239">/ 100 分</span></div><p class="print-red">错题变式已全部完成</p></div><h2>四关成绩</h2><table><thead><tr><th>关卡</th><th>分项得分</th><th>正式尝试</th><th>必修变式掌握</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td>'+escapeHtml(x.name)+'</td><td>'+x.score+' / '+STAGES[STAGES.findIndex(function(s){return s.name===x.name})].points+'</td><td>'+x.attempts+' 次</td><td>'+x.practice+' 题</td></tr>'}).join('')+'</tbody></table><div class="print-box"><h2>本次学习得到的结论</h2><p>① 苯环侧链的数目、连接和相对位置决定名称；对位可写 1,4- 或 p-。</p><p>② C₈H₁₀ 的单苯环饱和侧链结构有乙苯与邻、间、对二甲苯四种；旋转与反向编号不另算。</p><p>③ 颜色变化要结合侧链结构与模型条件；一次相同现象不能唯一指认未知样品的身份或纯度。</p></div><footer>课堂形成性反馈｜本机生成，非服务端认证。活动时间仅累计页面可见且训练进行中的时段。请勿将含身份的成绩单公开发布。</footer>'}
  var COLUMNS=['数据版本','游戏版本','随机记录编号','班级','游戏状态','总分','全局活动秒数','自评最难部分','详细覆盖范围','行类型','关卡序号','任务编号','任务名称','模式','事件或掌握状态','事件序号/正式尝试','错误或阻断项','提示级别/全局秒数','操作值/实验条件','本题累计活动秒数'];
  function exportData(){var base=[SCHEMA_VERSION,VERSION,state.sessionId,state.identity.className,reportReady()?'已通关':'进行中',calculateScore(),activity(),state.selfAssess,state.coverage];var rows=[];TASKS.forEach(function(t,i){var r=state.records[i];rows.push(base.concat(['任务汇总',t.stage+1,t.id,t.title,'汇总',r.hadWrong?r.practiceMastered?'已掌握':'待练':'无需重练','正式 '+r.attempts+' / 变式 '+r.practiceAttempts,r.lastErrors.join('|'),r.hintCount,'正式通过='+(!!r.snapshot),Math.floor(r.activeMs/1000)]))});state.events.forEach(function(e){var t=TASKS[e.task];rows.push(base.concat(['逐次事件',t.stage+1,t.id,t.title,e.mode,e.type,'#'+e.seq,e.detail,e.sec,e.value,Math.floor(state.records[e.task].activeMs/1000)]))});return {columns:COLUMNS,rows:rows}}
  function csvCell(v){var s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
  function toCsv(data){return [data.columns].concat(data.rows).map(function(row){return row.map(csvCell).join(',')}).join('\r\n')}
  function fallback(value){var area=$('copyFallback');area.hidden=false;area.value=value;area.focus();area.select();alert('浏览器不能直接复制。文本已显示并全选，请手动复制。')}
  function download(name,body,mime){var blob=new Blob([body],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
  $('soundToggle').onclick=function(){if(!state||conflict||blockingRaw!==null)return;state.sound=!state.sound;if(state.identity)save();nav()};document.addEventListener('visibilitychange',function(){if(!state||!state.identity||state.ended)return;if(document.visibilityState==='hidden'){settle();save();activeAt=null}else activeAt=performance.now()});window.addEventListener('pagehide',function(){if(state&&state.identity&&!state.ended&&!conflict)save()});setInterval(function(){if(state&&state.identity&&!state.ended&&!conflict&&document.visibilityState==='visible')save()},15000);
  state=load();if(!state){state=fresh()}render();
